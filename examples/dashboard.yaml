type: vertical-stack
cards:
  - type: entities
    title: TravelLog
    entities:
      - sensor.travellog_odometer
      - sensor.travellog_maintenance_overdue
      - sensor.travellog_maintenance_soon
      - sensor.travellog_maintenance_never_recorded
      - sensor.travellog_write_status
  - type: entities
    title: Tagesabschluss
    show_header_toggle: false
    entities:
      - entity: number.travellog_odometer_input
        name: Aktueller Kilometerstand
      - entity: sensor.nx_01_position_gps_location
        name: Tagesziel
      - entity: button.travellog_day_end
        name: Tagesabschluss speichern
  - type: entities
    title: Tanken
    show_header_toggle: false
    entities:
      - entity: number.travellog_odometer_input
        name: Aktueller Kilometerstand
      - entity: number.travellog_fuel_liters
        name: Füllmenge (optional)
      - entity: number.travellog_fuel_price_per_liter
        name: Literpreis (optional)
      - entity: number.travellog_fuel_total_price
        name: Gesamtpreis (optional)
      - entity: switch.travellog_fuel_full_tank
        name: Vollgetankt
      - entity: button.travellog_fuel
        name: Tankvorgang speichern
      - entity: button.travellog_reset_fuel_inputs
        name: Tankangaben leeren
  - type: markdown
    title: Wartungsaufgaben
    content: |-
      {% for task in state_attr('sensor.travellog_maintenance', 'tasks') or [] %}
      **{{ task.name }}** — {{ task.state.label }}
      Zuletzt: {{ task.last_performed_on or 'nie' }} · {{ task.last_odometer_km or '–' }} km
      Intervall: {{ task.interval_km or '–' }} km / {{ task.interval_months or '–' }} Monate

      {% endfor %}
